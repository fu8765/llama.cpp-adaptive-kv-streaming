name: Build Adaptive KV llama-server (Blackwell sm120 - CUDA 13)

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Adaptive KV source
        shell: pwsh
        run: |
          Write-Host "Checking repository for Adaptive KV support..."

          $matches = Get-ChildItem -Path . -Recurse -File |
            Select-String "kv-stream-stage-mib" -ErrorAction SilentlyContinue

          if (-not $matches) {
            throw "ERROR: Adaptive KV source was not found in this repository."
          }

          Write-Host "Adaptive KV source found:"
          $matches | Select-Object -First 10 | ForEach-Object {
            Write-Host "$($_.Path):$($_.LineNumber)"
          }

      - name: Setup CUDA Toolkit 13.2
        id: cuda
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '13.2.0'

      - name: Show CUDA version
        shell: pwsh
        run: |
          & "${{ steps.cuda.outputs.CUDA_PATH }}/bin/nvcc.exe" --version

      - name: Configure CMake
        shell: pwsh
        run: |
          if (Test-Path build) {
            Remove-Item -Recurse -Force build
          }

          cmake -S . -B build `
            -DGGML_CUDA=ON `
            -DGGML_CUDA_FA_ALL_QUANTS=ON `
            -DCMAKE_CUDA_ARCHITECTURES=120 `
            -DCMAKE_CUDA_COMPILER="${{ steps.cuda.outputs.CUDA_PATH }}/bin/nvcc.exe" `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build llama-server
        shell: pwsh
        run: |
          cmake --build build `
            --config Release `
            --target llama-server `
            -j 4

      - name: Verify Adaptive KV in compiled binary
        shell: pwsh
        run: |
          $server = ".\build\bin\Release\llama-server.exe"

          if (-not (Test-Path $server)) {
            throw "ERROR: llama-server.exe was not produced."
          }

          Write-Host ""
          Write-Host "Checking compiled llama-server for Adaptive KV support..."
          Write-Host ""

          $help = & $server --help 2>&1 | Out-String

          if ($help -notmatch "kv-stream-stage-mib") {
            throw "ERROR: --kv-stream-stage-mib is NOT present in the compiled llama-server."
          }

          Write-Host "SUCCESS!"
          Write-Host "Adaptive KV streaming is compiled into llama-server."
          Write-Host ""

          $help -split "`r?`n" |
            Where-Object { $_ -match "kv-stream-stage-mib" } |
            ForEach-Object { Write-Host $_ }

      - name: Upload Windows Binary
        uses: actions/upload-artifact@v4
        with:
          name: llama-server-windows-sm120-cu13-adaptive-kv
          path: build/bin/Release/llama-server.exe
