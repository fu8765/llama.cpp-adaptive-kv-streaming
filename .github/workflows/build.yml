name: Build Adaptive KV llama-server (Blackwell sm120)

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: feature/adaptive-kv-stream

      - name: Verify Adaptive KV source
        shell: pwsh
        run: |
          Write-Host "Checking repository for Adaptive KV support..."
          $matches = Get-ChildItem -Path . -Recurse -File |
            Select-String "kv-stream-stage-mib" -ErrorAction SilentlyContinue
          if (-not $matches) {
            throw "ERROR: Adaptive KV source was not found in this repository branch."
          }
          Write-Host "Adaptive KV source found in source tree."

      - name: Setup CUDA Toolkit 12.8
        id: cuda
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: '12.8.0'

      - name: Setup Visual Studio Developer Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Show CUDA version
        shell: pwsh
        run: |
          $env:PATH = "${{ steps.cuda.outputs.CUDA_PATH }}\bin;" + $env:PATH
          nvcc --version

      - name: Configure CMake for Blackwell (sm120)
        shell: pwsh
        run: |
          if (Test-Path build) {
            Remove-Item -Recurse -Force build
          }
          $env:PATH = "${{ steps.cuda.outputs.CUDA_PATH }}\bin;" + $env:PATH
          cmake -S . -B build `
            -G Ninja `
            -DGGML_CUDA=ON `
            -DGGML_CUDA_FA_ALL_QUANTS=ON `
            -DCMAKE_CUDA_ARCHITECTURES="120" `
            -DCMAKE_CUDA_FLAGS="-allow-unsupported-compiler" `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build llama-server
        shell: pwsh
        run: |
          $env:PATH = "${{ steps.cuda.outputs.CUDA_PATH }}\bin;" + $env:PATH
          cmake --build build --target llama-server -j 2

      - name: Verify Adaptive KV in compiled binary
        shell: pwsh
        run: |
          $binDir = (Get-Item "build\bin", "build\bin\Release" | Where-Object { Test-Path $_ } | Select-Object -First 1).FullName
          $server = Join-Path $binDir "llama-server.exe"

          if (-not (Test-Path $server)) {
            throw "ERROR: llama-server.exe was not found in build directory."
          }

          Write-Host "Reading binary stream via ASCII and Unicode encodings..."
          $bytes = [System.IO.File]::ReadAllBytes($server)
          $asciiText = [System.Text.Encoding]::ASCII.GetString($bytes)
          $unicodeText = [System.Text.Encoding]::Unicode.GetString($bytes)

          $found = ($asciiText -like "*kv-stream-stage-mib*") -or ($unicodeText -like "*kv-stream-stage-mib*")

          if ($found) {
            Write-Host "SUCCESS: Adaptive KV flag confirmed inside compiled binary!"
          } else {
            Write-Host "Exact string match failed. Scanning binary for any related 'kv-' flags..."
            $kvMatches = [regex]::Matches($asciiText, "kv[-_a-zA-Z0-9]{3,40}") | Select-Object -ExpandProperty Value -Unique
            if ($kvMatches) {
              Write-Host "Found related flags/strings in binary:"
              $kvMatches | ForEach-Object { Write-Host " - $_" }
            }
            throw "ERROR: --kv-stream-stage-mib flag was NOT found inside compiled binary."
          }

      - name: Bundle CUDA Runtime DLLs
        shell: pwsh
        run: |
          $targetDir = Get-Item "build\bin", "build\bin\Release" | Where-Object { Test-Path $_ } | Select-Object -First 1
          $cudaBin = "${{ steps.cuda.outputs.CUDA_PATH }}\bin"
          
          Write-Host "Bundling CUDA runtime DLLs..."
          Get-ChildItem -Path $cudaBin -Filter "cudart64_*.dll" | Copy-Item -Destination $targetDir.FullName -Force
          Get-ChildItem -Path $cudaBin -Filter "cublas*.dll" | Copy-Item -Destination $targetDir.FullName -Force

      - name: Upload Windows Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-server-windows-sm120-cu128-adaptive-kv
          path: |
            build/bin/llama-server.exe
            build/bin/*.dll
            build/bin/Release/llama-server.exe
            build/bin/Release/*.dll
