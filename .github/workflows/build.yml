name: Build Adaptive KV llama-server (Blackwell sm120)

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: feature/adaptive-kv-stream # Ensure this matches your exact feature branch name

      - name: Verify Adaptive KV source
        shell: pwsh
        run: |
          Write-Host "Checking repository for Adaptive KV support..."
          $matches = Get-ChildItem -Path . -Recurse -File |
            Select-String "kv-stream-stage-mib" -ErrorAction SilentlyContinue
          if (-not $matches) {
            throw "ERROR: Adaptive KV source was not found in this repository branch."
          }
          Write-Host "Adaptive KV source found:"
          $matches | Select-Object -First 10 | ForEach-Object {
            Write-Host "$($_.Path):$($_.LineNumber)"
          }

      - name: Setup CUDA Toolkit 12.8
        id: cuda
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: '12.8.0'

      - name: Setup Visual Studio Developer Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Show CUDA version
        shell: pwsh
        run: |
          $env:PATH = "${{ steps.cuda.outputs.CUDA_PATH }}\bin;" + $env:PATH
          nvcc --version

      - name: Configure CMake
        shell: pwsh
        run: |
          if (Test-Path build) {
            Remove-Item -Recurse -Force build
          }
          $env:PATH = "${{ steps.cuda.outputs.CUDA_PATH }}\bin;" + $env:PATH
          cmake -S . -B build `
            -G Ninja `
            -DGGML_CUDA=ON `
            -DGGML_CUDA_FA_ALL_QUANTS=ON `
            -DCMAKE_CUDA_ARCHITECTURES="120" `
            -DCMAKE_CUDA_FLAGS="-allow-unsupported-compiler" `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build llama-server
        shell: pwsh
        run: |
          $env:PATH = "${{ steps.cuda.outputs.CUDA_PATH }}\bin;" + $env:PATH
          cmake --build build `
            --target llama-server `
            -j 4

      - name: Bundle CUDA Runtime DLLs
        shell: pwsh
        run: |
          $targetDir = Get-Item "build\bin", "build\bin\Release" | Where-Object { Test-Path $_ } | Select-Object -First 1
          $cudaBin = "${{ steps.cuda.outputs.CUDA_PATH }}\bin"
          
          Write-Host "Copying all CUDA runtime binaries to target directory..."
          Get-ChildItem -Path $cudaBin -Filter "*.dll" | Copy-Item -Destination $targetDir.FullName -Force

      - name: Verify Adaptive KV in compiled binary
        shell: pwsh
        run: |
          $binDir = (Get-Item "build\bin", "build\bin\Release" | Where-Object { Test-Path $_ } | Select-Object -First 1).FullName
          $env:PATH = "$binDir;${{ steps.cuda.outputs.CUDA_PATH }}\bin;" + $env:PATH

          Write-Host "Latest commit on runner:"
          git log -1 --oneline

          $server = Join-Path $binDir "llama-server.exe"
          if (-not (Test-Path $server)) {
            throw "ERROR: llama-server.exe was not found in build directory."
          }

          Push-Location $binDir
          try {
            $out = & .\llama-server.exe --help 2>&1 | Out-String
          } finally {
            Pop-Location
          }

          if ($LASTEXITCODE -ne 0 -and -not $out) {
            throw "ERROR: llama-server.exe failed to run (Exit code $LASTEXITCODE)."
          }

          if ($out -notmatch "kv-stream-stage-mib") {
            Write-Host "--- OUTPUT SAMPLE ---"
            Write-Host ($out -split "`n" | Select-Object -First 30 | Out-String)
            throw "ERROR: --kv-stream-stage-mib flag is NOT present in the compiled binary."
          }

          Write-Host "SUCCESS: Adaptive KV flag confirmed in compiled binary!"

      - name: Upload Windows Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-server-windows-sm120-cu128-adaptive-kv
          path: |
            build/bin/llama-server.exe
            build/bin/*.dll
            build/bin/Release/llama-server.exe
            build/bin/Release/*.dll
