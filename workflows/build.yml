name: Build Adaptive KV llama-server (Blackwell sm120)

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup CUDA Toolkit 12.8
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda-version: '12.8.0'

      - name: Build llama-server
        run: |
          cmake -S . -B build -DGGML_CUDA=ON -DGGML_CUDA_FA_ALL_QUANTS=ON -DCMAKE_CUDA_ARCHITECTURES=120 -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --target llama-server -j 4

      - name: Upload Windows Binary
        uses: actions/upload-artifact@v4
        with:
          name: llama-server-windows-sm120
          path: build/bin/Release/llama-server.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup CUDA Toolkit 12.8
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda-version: '12.8.0'

      - name: Build llama-server
        run: |
          cmake -S . -B build -DGGML_CUDA=ON -DGGML_CUDA_FA_ALL_QUANTS=ON -DCMAKE_CUDA_ARCHITECTURES=120 -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --target llama-server -j 4

      - name: Upload Linux Binary
        uses: actions/upload-artifact@v4
        with:
          name: llama-server-linux-sm120
          path: build/bin/llama-server
